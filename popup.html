<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formatador de Texto LinkedIn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1419;
      color: #f3f3f3;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #28333e;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }
    .subtitle {
      font-size: 11px;
      color: #9ba1a6;
    }
    textarea {
      width: 100%;
      height: 64px;
      background: #19222b;
      border: 1px solid #38434f;
      border-radius: 8px;
      color: #ffffff;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: #0a66c2;
    }
    .styles-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .style-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #19222b;
      border-radius: 6px;
      padding: 7px 10px;
      border: 1px solid #28333e;
      transition: background 0.15s;
    }
    .style-row:hover {
      background: #202b37;
    }
    .style-label {
      font-size: 12px;
      color: #9ba1a6;
      width: 75px;
      flex-shrink: 0;
    }
    .style-preview {
      font-size: 13px;
      color: #ffffff;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0 8px;
    }
    .copy-btn {
      background: #0a66c2;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .copy-btn:hover {
      background: #004182;
    }
    .copy-btn.copied {
      background: #057642;
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: #66727d;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Logo" class="logo">
    <div>
      <div class="title">Negrito & Itálico LinkedIn</div>
      <div class="subtitle">Destaque seus posts</div>
    </div>
  </div>

  <textarea id="inputText" placeholder="Digite uma palavra ou frase aqui..."></textarea>

  <div class="styles-list" id="stylesList">
    <!-- Linhas geradas dinamicamente via popup.js -->
  </div>

  <div class="footer">
    💡 No LinkedIn: basta selecionar o texto do post!
  </div>

  <script src="popup.js"></script>
</body>
</html>
